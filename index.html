<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>Frais KM</title>
</head>
<body>
<header>
  <div>
    <h1>🚗 Frais KM</h1>
    <p>Mes déplacements professionnels</p>
  </div>
  <button id="logout" class="ghost hidden">Déconnexion</button>
</header>

<main>
<section id="authView" class="card">
  <div class="tabs">
    <button id="tabLogin" class="tab active">Connexion</button>
    <button id="tabSignup" class="tab">Créer mon profil</button>
  </div>

  <form id="loginForm">
    <h2>Bienvenue 👋</h2>
    <label>E-mail<input id="loginEmail" type="email" autocomplete="email" required></label>
    <label>Mot de passe<input id="loginPassword" type="password" autocomplete="current-password" required></label>
    <button type="submit">Se connecter</button>
  </form>

  <form id="signupForm" class="hidden">
    <h2>Créer mon profil</h2>
    <label>Prénom<input id="firstName" autocomplete="given-name" required></label>
    <label>Nom<input id="lastName" autocomplete="family-name" required></label>
    <label>E-mail<input id="signupEmail" type="email" autocomplete="email" required></label>
    <label>Mot de passe<input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required></label>
    <button type="submit">Créer mon compte</button>
    <p class="hint">Un e-mail de confirmation peut être demandé selon les réglages du compte.</p>
  </form>
  <div id="authMessage" aria-live="polite"></div>
</section>

<section id="appView" class="hidden">
  <div class="welcome">
    <div>
      <h2 id="hello">Bonjour 👋</h2>
      <p>Ton kilométrage est sauvegardé dans ton compte.</p>
    </div>
  </div>

  <section class="card">
    <h2>Nouveau trajet</h2>
    <form id="tripForm">
      <label>Date<input id="date" type="date" required></label>
      <label>Départ
      <input id="departure" placeholder="Saisir une adresse de départ..." required>
      </label>
      <label>Arrivée<input id="arrival" placeholder="Saisir une adresse d'arrivée..." required></label>
      <div class="row">
        <button id="reverse" type="button" class="secondary">↕️ Inverser</button>
        <button id="calculate" type="button">📏 Calculer</button>
      </div>
      <div id="result" class="result hidden" aria-live="polite"></div>
      <label>Motif<input id="reason" placeholder="Visite, réunion, formation..."></label>
      <button id="saveTrip" type="submit" disabled>💾 Enregistrer</button>
      <div id="tripMessage" aria-live="polite"></div>
    </form>
  </section>

  <section class="card">
    <div class="sectionHead"><h2>📊 Kilométrage</h2><select id="yearSelect"></select></div>
    <div class="yearTotal"><span>Total annuel</span><strong id="yearTotal">0,0 km</strong></div>
    <div id="months" class="months"></div>
  </section>

  <section class="card">
  <div class="sectionHead">
    <h2>📋 Historique</h2>
    <select id="historyMonth"></select>
  </div>

  <div id="history"></div>

  <div class="row exportRow">
    <button id="exportYear" type="button" class="secondary">
      📊 Excel année
    </button>

    <button id="exportMonth" type="button" class="secondary">
      📅 Excel mois
    </button>
  </div>

  <div id="exportMessage" class="small" aria-live="polite"></div>
</section>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
