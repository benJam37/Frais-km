<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Frais KM</title>
</head>
<body>
<header>
  <h1>🚗 Frais KM</h1>
  <p>Mes déplacements professionnels</p>
</header>

<main>
  <section class="card">
    <h2>Nouveau trajet</h2>
    <label>Date<input id="date" type="date"></label>

    <label>Départ
      <div class="row">
        <input id="departure" placeholder="Ex. 42 rue de Miré, Ballan-Miré">
        <button id="gps" class="secondary" title="Ma position">📍</button>
      </div>
    </label>

    <label>Arrivée<input id="arrival" placeholder="Ex. 10 rue Gutenberg, Joué-lès-Tours"></label>

    <div class="row">
      <button id="reverse" class="secondary">↕️ Inverser</button>
      <button id="calculate">Calculer la distance</button>
    </div>

    <div id="result" class="result hidden"></div>

    <label>Motif<input id="reason" placeholder="Visite, réunion, formation..."></label>
    <button id="save" disabled>💾 Enregistrer le trajet</button>
    <div id="message"></div>
  </section>

  <section class="card">
    <h2>Résumé</h2>
    <div class="stats">
      <div><span>Aujourd'hui</span><strong id="dayTotal">0,0 km</strong></div>
      <div><span>Ce mois</span><strong id="monthTotal">0,0 km</strong></div>
      <div><span>Cette année</span><strong id="yearTotal">0,0 km</strong></div>
    </div>
  </section>

  <section class="card">
    <div class="sectionHead">
      <h2>Historique</h2>
      <button id="clear" class="danger">Tout effacer</button>
    </div>
    <div id="history"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
